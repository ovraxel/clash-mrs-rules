
name: Build Clash MRS Rules

on:
  workflow_dispatch:

  schedule:
    - cron: '0 3 * * *'

  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/build-mrs.yml'

permissions:
  contents: write

concurrency:
  group: clash-mrs-main
  cancel-in-progress: false

jobs:
  build:
    name: Build and Publish MRS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ====================================
      # 1. Checkout
      # ====================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # ====================================
      # 2. Python
      # ====================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ====================================
      # 3. Dependencies
      # ====================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install PyYAML

          command -v curl
          command -v jq
          command -v gzip
          command -v sha256sum

      # ====================================
      # 4. Download official Mihomo
      # ====================================

      - name: Download Mihomo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            repos/MetaCubeX/mihomo/releases/latest \
            > mihomo-release.json

          TAG=$(jq -r '.tag_name' mihomo-release.json)

          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "::error::Unable to read Mihomo release"
            exit 1
          fi

          ASSET=$(jq -r '
            [
              .assets[]
              | select(
                  .name
                  | test("^mihomo-linux-amd64-compatible-.*\\.gz$")
                )
            ]
            | sort_by(.name)
            | last
            | .name // empty
          ' mihomo-release.json)

          if [[ -z "$ASSET" ]]; then
            echo "::error::Compatible Mihomo asset not found"
            exit 1
          fi

          URL=$(jq -r --arg name "$ASSET" '
            .assets[]
            | select(.name == $name)
            | .browser_download_url
          ' mihomo-release.json)

          DIGEST=$(jq -r --arg name "$ASSET" '
            .assets[]
            | select(.name == $name)
            | .digest // empty
          ' mihomo-release.json)

          echo "Mihomo release: $TAG"
          echo "Selected asset: $ASSET"

          if [[ "$DIGEST" != sha256:* ]]; then
            echo "::error::Missing official SHA256 digest"
            exit 1
          fi

          curl -fL \
            --retry 3 \
            --connect-timeout 15 \
            "$URL" \
            -o mihomo.gz

          echo "${DIGEST#sha256:}  mihomo.gz" \
            | sha256sum -c -

          gzip -dc mihomo.gz > mihomo

          chmod +x mihomo

          sudo install -m 755 mihomo /usr/local/bin/mihomo

          mihomo -v

      # ====================================
      # 5. Build all rules
      # ====================================

      - name: Build MRS rules
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: |
          set -euo pipefail

          python scripts/build.py

      # ====================================
      # 6. Verify outputs
      # ====================================

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== MRS checksum verification ==="

          (
            cd output
            sha256sum -c SHA256SUMS
          )

          echo "=== Generated files ==="

          find output -maxdepth 1 -type f -print

          echo "=== Repository files ==="

          find rule/Clash -type f -print

          MRS_COUNT=$(find output \
            -maxdepth 1 \
            -type f \
            -name '*.mrs' \
            | wc -l)

          README_COUNT=$(find rule/Clash \
            -type f \
            -name 'README.md' \
            | wc -l)

          if [[ "$MRS_COUNT" -eq 0 ]]; then
            echo "::error::No MRS files generated"
            exit 1
          fi

          if [[ "$README_COUNT" -lt "$MRS_COUNT" ]]; then
            echo "::error::Missing generated README files"
            exit 1
          fi

          echo "MRS files: $MRS_COUNT"
          echo "README files: $README_COUNT"

      # ====================================
      # 7. Upload artifact
      # ====================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clash-mrs-rules
          path: output/
          retention-days: 30
          if-no-files-found: error

      # ====================================
      # 8. Commit and push
      # ====================================

      - name: Commit MRS files to repository
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A rule/Clash/

          echo "=== Git status ==="

          git status --short

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          echo "=== Checking remote branch ==="

          git fetch origin main

          LOCAL_BASE=$(git rev-parse HEAD)
          REMOTE_HEAD=$(git rev-parse origin/main)

          if [[ "$LOCAL_BASE" != "$REMOTE_HEAD" ]]; then
            echo "::error::main changed during build"
            echo "Please rerun this workflow"
            exit 1
          fi

          git commit \
            -m "chore: update MRS rules and README"

          git push origin HEAD:main

          echo "Repository updated successfully"

      # ====================================
      # 9. Publish daily release
      # ====================================

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG="daily-$(date -u +%Y%m%d)"

          echo "Publishing: $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then

            gh release upload "$TAG" \
              output/*.mrs \
              output/SHA256SUMS \
              --clobber

          else

            gh release create "$TAG" \
              output/*.mrs \
              output/SHA256SUMS \
              --target main \
              --title "MRS Rules $TAG" \
              --notes "Automatically generated Mihomo MRS rules." \
              --latest

          fi

          echo "Release published successfully"
